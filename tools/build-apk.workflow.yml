name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.p12"
            echo "KEYSTORE_PATH=${RUNNER_TEMP}/release.p12" >> "${GITHUB_ENV}"
            echo "키스토어: GitHub secret 사용"
          elif [ -f keystore/release.p12 ]; then
            echo "키스토어: 저장소 안의 keystore/release.p12 사용"
          else
            echo "키스토어 없음 — 서명 없이 빌드합니다 (설치는 되지만 업데이트 시 데이터가 초기화될 수 있음)"
          fi

      - name: APK 빌드
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK 정리 및 서명 확인
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/minjeong-recipe-book-v1.0.0.apk"
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          ls -l dist
          cat dist/SHA256SUMS.txt
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: ${BT}"
          "${BT}/apksigner" verify --print-certs "dist/minjeong-recipe-book-v1.0.0.apk" || true

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: minjeong-recipe-book-apk
          path: dist/*
          retention-days: 90
