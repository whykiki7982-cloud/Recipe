/* ===========================================================
   동기화 — 체험 모드(로컬) · 실시간 가족 연결(Firebase RTDB REST+SSE)
   =========================================================== */
function fbBase() { return (cfg.db || '').replace(/\/+$/, ''); }
function fbRoom(path) { return fbBase() + '/rooms/' + encodeURIComponent(cfg.room) + (path ? '/' + path : '') + '.json'; }

function setConn(c) {
  state.conn = c;
  updateStatus();
}

const Sync = {
  es: null, pollTimer: null, firstLoad: true, ready: false, queue: [], warned: false, lastOk: 0,

  /* ---- 시작 / 정지 ---- */
  start() {
    this.stop();
    if (cfg.db) {
      state.mode = 'cloud';
      this.ready = false;
      connectCloud();
    } else {
      state.mode = 'local';
      setConn('local');
    }
    updateStatus();
  },
  stop() {
    if (this.es) { try { this.es.close(); } catch (e) { } this.es = null; }
    if (this.pollTimer) { clearInterval(this.pollTimer); this.pollTimer = null; }
    if (this.retryTimer) { clearTimeout(this.retryTimer); this.retryTimer = null; }
  },

  /* ---- 쓰기 ---- */
  async _put(path, data) {
    const r = await fetch(fbRoom(path), {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data === undefined ? null : data)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r;
  },
  write(path, data) {
    if (!cfg.db) return;
    this._put(path, data).catch(() => {
      this.queue.push({ path, data });
      if (!this.warned) {
        this.warned = true;
        toast('서버에 저장하지 못했어요. 연결되면 다시 보낼게요 🙏', { ms: 2800 });
      }
    });
  },
  flush() {
    if (!cfg.db || !this.queue.length) return;
    const q = this.queue.splice(0);
    q.forEach(w => {
      this._put(w.path, w.data).catch(() => this.queue.push(w));
    });
  },
  putMessage(msg) { this.write('messages/' + msg.id, msg); },
  putReactions(msg) {
    const r = msg.reactions || {};
    this.write('messages/' + msg.id + '/reactions', Object.keys(r).length ? r : null);
  },
  removeMessage(id) { this.write('messages/' + id, null); },
  putCfg() {
    this.write('cfg', { code: cfg.code, members: cfg.members, roomName: cfg.roomName, updatedAt: Date.now() });
  }
};

/* ---------------- 실시간 연결 ---------------- */
async function connectCloud() {
  if (!cfg.db) { setConn('local'); return; }
  setConn('connecting');
  try {
    const r = await fetch(fbRoom(''), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const serverMsgs = (data && data.messages) ? Object.values(data.messages).filter(m => m && m.id) : [];
    if (!serverMsgs.length && state.messages.length) {
      /* 처음 연결: 이 기기의 대화를 가족 방에 올려요 */
      const list = state.messages.slice(-120);
      for (const m of list) {
        try { await Sync._put('messages/' + m.id, m); } catch (e) { break; }
      }
      await Sync.putCfg();
      toast('이 기기의 대화를 가족 방에 올렸어요 ☁️', { ms: 2200 });
    } else {
      mergeRemote(data, true);
      if (!data || !data.cfg) Sync.putCfg();
    }
    setConn('on');
    Sync.ready = true;
    Sync.lastOk = Date.now();
  } catch (e) {
    setConn('retry');
  }
  openStream();
  startPolling();
}

function openStream() {
  if (!cfg.db || !window.EventSource) return;
  if (Sync.es) { try { Sync.es.close(); } catch (e) { } }
  let es;
  try { es = new EventSource(fbRoom('')); } catch (e) { return; }
  Sync.es = es;
  es.addEventListener('put', ev => {
    try {
      const p = JSON.parse(ev.data);
      applyPut(p);
      Sync.lastOk = Date.now();
      setConn('on');
      Sync.flush();
    } catch (e) { }
  });
  es.addEventListener('patch', ev => {
    try {
      const p = JSON.parse(ev.data);
      applyPatch(p);
      Sync.lastOk = Date.now();
      setConn('on');
    } catch (e) { }
  });
  es.onopen = () => { Sync.lastOk = Date.now(); setConn('on'); };
  es.onerror = () => {
    /* 잠깐 끊긴 것뿐이면 화면을 놀라게 하지 않아요 (자동 재연결) */
    if (!Sync.lastOk || Date.now() - Sync.lastOk > 12000) setConn('retry');
    if (Sync.es) { try { Sync.es.close(); } catch (e) { } Sync.es = null; }
    if (Sync.retryTimer) clearTimeout(Sync.retryTimer);
    Sync.retryTimer = setTimeout(() => { if (cfg.db && !Sync.es) openStream(); }, 9000);
  };
}

function startPolling() {
  if (Sync.pollTimer) clearInterval(Sync.pollTimer);
  Sync.pollTimer = setInterval(async () => {
    if (!cfg.db) return;
    try {
      const r = await fetch(fbRoom(''), { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      mergeRemote(data, true);
      Sync.lastOk = Date.now();
      setConn('on');
    } catch (e) {
      if (!Sync.lastOk || Date.now() - Sync.lastOk > 20000) setConn('retry');
    }
  }, 10000);
}

/* ---------------- 서버 → 화면 ---------------- */
function applyPut(p) {
  if (!p) return;
  const path = p.path || '/';
  if (path === '/' || path === '') { mergeRemote(p.data, false); return; }
  const parts = path.split('/').filter(Boolean);
  if (parts[0] === 'messages') {
    const id = parts[1];
    if (parts.length === 2) {
      if (p.data) upsertRemote(p.data);
      else removeRemote(id);
    } else if (parts.length >= 3) {
      const cur = state.messages.find(m => m.id === id);
      if (cur) {
        cur[parts[2]] = p.data;
        if (parts[2] === 'reactions' && !p.data) delete cur.reactions;
        saveMsgs();
        renderMessages();
      }
    }
    return;
  }
  if (parts[0] === 'cfg' && parts.length === 2 && p.data) {
    mergeRemote({ cfg: p.data }, true);
  }
}

function applyPatch(p) {
  if (!p || !p.path) return;
  const parts = p.path.split('/').filter(Boolean);
  if (parts[0] === 'messages' && parts[1]) {
    const cur = state.messages.find(m => m.id === parts[1]);
    if (cur && p.data && typeof p.data === 'object') {
      Object.assign(cur, p.data);
      saveMsgs();
      renderMessages();
    }
  }
}

function upsertRemote(m, silent) {
  const i = state.messages.findIndex(x => x.id === m.id);
  if (i >= 0) {
    if (JSON.stringify(state.messages[i]) !== JSON.stringify(m)) {
      state.messages[i] = m;
      saveMsgs();
      renderMessages();
    }
    return;
  }
  state.messages.push(m);
  saveMsgs();
  renderMessages();
  if (!silent && Sync.ready && m.sender !== state.me) {
    ding('in');
    if (document.hidden) notifyBrowser(m); else toastMsg(m);
  }
}

function removeRemote(id) {
  const before = state.messages.length;
  state.messages = state.messages.filter(m => m.id !== id);
  if (state.messages.length !== before) { saveMsgs(); renderMessages(); }
}

function mergeRemote(d, silent) {
  if (!d) return;
  if (d.cfg) applyRemoteCfg(d.cfg);
  if (!d.messages) return;
  const remote = Object.values(d.messages).filter(m => m && m.id && m.ts);
  const ids = new Set(remote.map(m => m.id));
  let changed = false;
  remote.forEach(m => {
    const i = state.messages.findIndex(x => x.id === m.id);
    if (i < 0) {
      state.messages.push(m);
      changed = true;
      if (!silent && Sync.ready && m.sender !== state.me) {
        ding('in');
        if (document.hidden) notifyBrowser(m); else toastMsg(m);
      }
    } else if (JSON.stringify(state.messages[i]) !== JSON.stringify(m)) {
      state.messages[i] = m;
      changed = true;
    }
  });
  const before = state.messages.length;
  state.messages = state.messages.filter(m => ids.has(m.id));
  if (state.messages.length !== before) changed = true;
  if (changed) {
    saveMsgs();
    renderMessages();
  }
}

/* ---------------- 설정(비밀번호·이름·아바타) 동기화 ---------------- */
function applyRemoteCfg(rc) {
  if (!rc || typeof rc !== 'object') return;
  if (typeof rc.code === 'string' && /^\d{4}$/.test(rc.code)) cfg.code = rc.code;
  if (typeof rc.roomName === 'string' && rc.roomName.trim()) cfg.roomName = rc.roomName.trim();
  if (rc.members && typeof rc.members === 'object') {
    MEMBER_IDS.forEach(id => {
      const m = rc.members[id];
      if (m && typeof m === 'object') {
        cfg.members[id] = {
          name: (typeof m.name === 'string' && m.name.trim()) ? m.name.trim().slice(0, 12) : cfg.members[id].name,
          avatar: AVATAR_IDS.includes(m.avatar) ? m.avatar : cfg.members[id].avatar
        };
      }
    });
  }
  saveCfg();
  if (state.me) { renderHeader(); renderMessages(); }
}

function copyInvite() {
  const link = inviteLink();
  const done = () => toast('초대 링크를 복사했어요 🔗');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(link).then(done).catch(() => fallbackCopy(link, done));
  } else fallbackCopy(link, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { toast('복사가 안 돼요. 링크를 길게 눌러 복사해 주세요'); }
  ta.remove();
}

/* ---------------- 실시간 연결 ---------------- */
function normalizeDb(v) {
  let s = (v || '').trim();
  if (!s) return '';
  if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
  s = s.replace(/\/+$/, '');
  if (/\.firebaseio\.com/i.test(s) && !/firebasedatabase\.app/i.test(s)) {
    /* 예전 형식 주소도 그대로 씁니다 */
  }
  return s;
}
async function saveDb() {
  const raw = $('#dbInput') ? $('#dbInput').value : '';
  const url = normalizeDb(raw);
  if (!url) {
    cfg.db = ''; saveCfg();
    stopSync(); state.mode = 'local'; setConn('local');
    toast('체험 모드로 돌아왔어요');
    openSettings();
    return;
  }
  if (!/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(url)) {
    toast('주소를 다시 확인해 주세요. https://…firebasedatabase.app 형식이에요');
    return;
  }
  toast('가족 방에 연결하는 중… ☁️', { ms: 1400 });
  cfg.db = url;
  saveCfg();
  Sync.stop();
  state.mode = 'cloud';
  await connectCloud();
  if (state.conn === 'on') toast('실시간 가족 연결 성공! 🎉 이제 가족 모두 같은 대화를 봐요');
  else toast('연결하지 못했어요. 주소와 보안 규칙(테스트 모드)을 확인해 주세요 😢', { ms: 3200 });
  openSettings();
}

/* ---------------- 샘플 대화 ---------------- */
function demoVoiceDataURL() {
  try {
    const sr = 8000, dur = 1.1, n = Math.floor(sr * dur);
    const buf = new ArrayBuffer(44 + n * 2);
    const v = new DataView(buf);
    const wStr = (off, s) => { for (let i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); };
    wStr(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); wStr(8, 'WAVEfmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); wStr(36, 'data'); v.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const f = t < .35 ? 520 : (t < .7 ? 440 : 620);
      const env = Math.min(1, t * 12) * Math.max(0, 1 - t / dur);
      const s = Math.sin(2 * Math.PI * f * t) * env * 0.35 + Math.sin(2 * Math.PI * f * 2 * t) * env * 0.08;
      v.setInt16(44 + i * 2, Math.max(-1, Math.min(1, s)) * 32767, true);
    }
    const bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return 'data:audio/wav;base64,' + btoa(bin);
  } catch (e) { return ''; }
}

function seedDemo(force) {
  const now = Date.now();
  const base = now - 1000 * 60 * 26;

    { sender: 'girl', type: 'text', text: '좋아요!! 엄마 고마워 ❤️', ts: base + 1000 * 60 * 22 }
  ];
  const cur = new Set(state.messages.map(m => m.id));

  if (state.view === 'chat') toast(force ? '샘플 대화를 넣었어요 🧪' : '샘플 대화로 시작해 볼게요');
}


/* ===========================================================
   시작
   =========================================================== */
function parseInvite() {
  let params;
  try { params = new URL(location.href).searchParams; } catch (e) { return; }
  const pdb = params.get('db');
  const proom = params.get('room');
  const pcode = params.get('code');
  if (!pdb && !proom && !pcode) return;
  if (pdb) cfg.db = normalizeDb(pdb);
  if (proom) cfg.room = decodeURIComponent(proom);
  if (pcode && /^\d{4}$/.test(pcode)) cfg.code = pcode;
  saveCfg();
  invited = true;
}

function boot() {
  loadCfg();
  loadMsgs();
  parseInvite();

  renderLogin();
  bindLogin();
  bindChat();
  paintCodeHint();

  /* 시트 바깥을 누르면 닫기 */
  $('#sheet').addEventListener('click', e => {
    if (e.target.id === 'sheet') closeSheet();
  });

  /* 첫 방문이면 샘플 대화 */
  let seeded = false;
  try { seeded = localStorage.getItem('ft.v1.seeded') === '1'; } catch (e) { }
  if (!state.messages.length && !seeded) {
    try { localStorage.setItem('ft.v1.seeded', '1'); } catch (e) { }
    seedDemo(false);
  }

  /* 기억된 프로필로 바로 들어가기 */
  let savedMe = null, remember = true;
  try {
    savedMe = localStorage.getItem(LS.me);
    remember = localStorage.getItem(LS.unlock) !== '0';
  } catch (e) { }
  if (!invited && remember && savedMe && MEMBER_IDS.includes(savedMe)) {
    state.me = savedMe;
    enterChat();
  } else {
    showView('profile');
  }

  /* 같은 기기의 다른 탭과 맞추기 (체험 모드) */
  window.addEventListener('storage', e => {
    if (e.key === LS.msgs) {
      try {
        const arr = JSON.parse(e.newValue || '[]');
        if (!Array.isArray(arr)) return;
        const before = state.messages.length;
        state.messages = arr.filter(m => m && m.id && m.ts);
        renderMessages();
        const last = sortedMsgs().slice(-1)[0];
        if (state.messages.length > before && last && last.sender !== state.me) {
          ding('in');
          if (document.hidden) notifyBrowser(last); else toastMsg(last);
        }
      } catch (err) { }
    } else if (e.key === LS.cfg) {
      try {
        const raw = JSON.parse(e.newValue || 'null');
        if (raw) applyRemoteCfg(raw);
      } catch (err) { }
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updateBell();
      if (state.view === 'chat') scrollBottom();
    }
  });

  window.addEventListener('beforeunload', () => {
    if (Rec.active) { try { Rec.mr && Rec.mr.stop(); } catch (e) { } }
  });

  /* 첫 터치에 오디오 깨우기 (모바일 알림음) */
  const wake = () => { audioCtx(); };
  document.addEventListener('touchstart', wake, { once: true, passive: true });
  document.addEventListener('click', wake, { once: true });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
